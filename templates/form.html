
{% extends "base.html" %}

{% block title %}
    {% if filme %}Editar filme{% else %}Cadastrar filme{% endif %}
    | Catálogo de Filmes
{% endblock %}

{% block content %}
    <h2>
        {% if filme %}
            Editar filme
        {% else %}
            Cadastrar novo filme
        {% endif %}
    </h2>

    <form method="POST">
        <label for="titulo">Título do filme:</label>
        <input
            type="text"
            id="titulo"
            name="titulo"
            maxlength="150"
            required
            value="{{ filme['titulo'] if filme else '' }}"
        >

        <label for="genero">Gênero:</label>
        <input
            type="text"
            id="genero"
            name="genero"
            maxlength="80"
            required
            value="{{ filme['genero'] if filme else '' }}"
        >

        <label for="ano">Ano de lançamento:</label>
        <input
            type="number"
            id="ano"
            name="ano"
            min="1888"
            max="2100"
            required
            value="{{ filme['ano'] if filme else '' }}"
        >

        <label for="nota">Nota (de 1 a 10):</label>
        <input
            type="number"
            id="nota"
            name="nota"
            min="1"
            max="10"
            step="0.1"
            required
            value="{{ filme['nota'] if filme else '' }}"
        >

        <p>
            <button class="botao" type="submit">
                {% if filme %}Salvar alterações{% else %}Cadastrar filme{% endif %}
            </button>
            <a href="{{ url_for('index') }}">Cancelar</a>
        </p>
    </form>
{% endblock %}
